<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#312e81" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>
  <!-- Checkbox body -->
  <rect x="120" y="145" width="230" height="230" rx="36" ry="36"
        fill="none" stroke="white" stroke-width="28" opacity="0.9" filter="url(#shadow)"/>
  <!-- Top-right flap extends beyond checkbox -->
  <line x1="350" y1="145" x2="395" y2="105"
        stroke="white" stroke-width="28" stroke-linecap="round" opacity="0.9"/>
  <!-- Checkmark -->
  <polyline points="175,270 225,325 395,135"
            fill="none" stroke="white" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Horizontal lines (task list lines) -->
  <line x1="135" y1="410" x2="300" y2="410" stroke="white" stroke-width="16" stroke-linecap="round" opacity="0.45"/>
  <line x1="135" y1="450" x2="250" y2="450" stroke="white" stroke-width="16" stroke-linecap="round" opacity="0.3"/>
</svg>
